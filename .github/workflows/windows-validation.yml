name: Windows Validation

"on":
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "src-tauri/**"
      - "scripts/prepare-windows-ocr.ps1"
      - ".github/workflows/windows-validation.yml"
      - "Cargo.lock"
      - "pnpm-lock.yaml"

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64 build and native tests
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:icon
        env:
          PLATFORM: windows-latest
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Prepare bundled OCR when present
        shell: pwsh
        run: |
          if (Test-Path scripts/prepare-windows-ocr.ps1) {
            ./scripts/prepare-windows-ocr.ps1 -Architecture x64
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - run: pnpm tsc
      - run: pnpm lint
      - name: Rust formatting
        working-directory: src-tauri
        run: cargo fmt --all --check
      - name: Windows native compile and lint
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Windows native tests
        working-directory: src-tauri
        run: cargo test --all-targets --all-features
      - name: Windows clipboard image round trip
        working-directory: src-tauri
        run: cargo test --lib clipboard::write::tests::round_trip_image_matches_hash -- --ignored --exact --nocapture
